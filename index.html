<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WRA Sports | Colombo - PR</title>
  <style>
    :root {
      --bg: #0f1216;
      --surface: #181d24;
      --surface-2: #222933;
      --text: #f3f6fa;
      --muted: #a7b1c2;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --border: #2c3543;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 68px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .hero {
      padding: 64px 0;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      background: rgba(22, 163, 74, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.2rem;
      line-height: 1.2;
      margin-bottom: 16px;
      max-width: 760px;
    }

    .hero p {
      color: var(--muted);
      max-width: 680px;
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    section {
      padding: 56px 0;
      border-bottom: 1px solid var(--border);
    }

    h2 {
      font-size: 1.55rem;
      margin-bottom: 12px;
    }

    .section-desc {
      color: var(--muted);
      margin-bottom: 28px;
      max-width: 720px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .info-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .info-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .info-list li {
      color: var(--muted);
    }

    .info-list strong {
      color: var(--text);
    }

    footer {
      padding: 28px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="#topo" class="brand">WRA <span>SPORTS</span></a>
      <nav class="nav-links">
        <a href="#sobre">Sobre</a>
        <a href="#atuacao">O que oferecemos</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>
  </header>

  <main id="topo">
